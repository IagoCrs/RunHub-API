spring.application.name=runhub

# Banco de dados H2 (roda dentro do projeto, na memoria)
spring.datasource.url=jdbc:h2:mem:runhubdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
